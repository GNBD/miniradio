<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXTENDED Editor v0.2.0 beta</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;
        --acc:#2f81f7;--ok:#3fb950;--warn:#d29922;--err:#f85149;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 system-ui,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:15px}
  .badge{font-size:11px;font-weight:700;color:var(--acc);
         border:1px solid var(--acc);border-radius:999px;padding:1px 8px}
  .wrap{display:grid;grid-template-columns:320px 1fr 260px;gap:12px;padding:12px}
  @media(max-width:1000px){.wrap{display:block}.card{margin-bottom:12px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.05em;color:var(--muted)}
  label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;background:#0b0f14;color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
  textarea{resize:vertical;font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
  textarea.layout{min-height:180px}
  textarea.script{min-height:300px}
  button{background:var(--acc);color:#fff;border:0;border-radius:6px;
         padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .msg{margin-top:10px;font-size:12px;white-space:pre-wrap;word-break:break-word}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}
  ul.list{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
  ul.list li{display:flex;align-items:center;gap:6px;padding:6px;
             border-bottom:1px solid var(--line);font-size:12px}
  ul.list li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
                  white-space:nowrap}
  .tag{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
       color:var(--muted)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <b>EXTENDED Editor</b><span class="badge">v0.2.0 beta</span>
  <span class="hint">테마 / 확장 앱 EXLU 편집기</span>
</header>

<div class="wrap">
  <section class="card">
    <h3>앱 정보</h3>
    <label>종류</label>
    <select id="kind">
      <option value="app">확장 앱 (app)</option>
      <option value="theme">라디오 테마 (theme)</option>
    </select>
    <label>형태</label>
    <select id="type">
      <option value="layout">레이아웃 + Lua</option>
      <option value="script">Lua 단독 (즉시 실행 액션)</option>
    </select>
    <label>앱 이름 (메뉴 표시)</label>
    <input id="name" maxlength="31" placeholder="My Radio App">
    <label>작성자</label>
    <input id="author" maxlength="31" placeholder="your name">
    <label>ID (파일명, 영문/숫자/_-)</label>
    <input id="id" maxlength="31" placeholder="my-app">
    <div class="hint">ID를 비우면 이름에서 자동 생성됩니다.</div>
    <div class="row">
      <button onclick="save()">기기에 저장</button>
      <button class="ghost" onclick="download()">PC로 내려받기</button>
    </div>
    <div id="msg1" class="msg"></div>
  </section>

  <section class="card">
    <h3>레이아웃 (선택)</h3>
    <textarea id="layout" class="layout"
      placeholder="레이아웃을 비우면 Lua 단독 액션으로 저장됩니다."></textarea>
    <h3 style="margin-top:14px">Lua 스크립트</h3>
    <textarea id="script" class="script"
      placeholder="-- 예) function on_tick(ms) ... end"></textarea>
    <div class="hint">
      테마는 Lua를 가질 수 없습니다(기본 라디오 보호). 검증 실패 시 저장되지 않고 원인이 표시됩니다.
    </div>
    <div id="msg2" class="msg"></div>
  </section>

  <section class="card">
    <h3>기기에 있는 EXLU</h3>
    <div class="row">
      <button class="ghost" onclick="refresh()">새로고침</button>
      <button class="ghost" onclick="applyCurrent()">적용</button>
    </div>
    <ul id="list" class="list"></ul>
    <div id="msg3" class="msg"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);

function say(el, text, cls) {
  const n = $(el);
  n.textContent = text || "";
  n.className = "msg" + (cls ? " " + cls : "");
}

function slug(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-")
    .replace(/^-+|-+$/g, "").slice(0, 31);
}

function currentId() {
  return slug($("id").value.trim() || $("name").value.trim());
}

function buildExlu() {
  const kind = $("kind").value;
  const type = $("type").value;
  const name = $("name").value.trim();
  const author = $("author").value.trim();
  const id = currentId();
  const layout = $("layout").value.replace(/\r\n/g, "\n").trim();
  const script = $("script").value.replace(/\r\n/g, "\n").trim();
  if (!name) throw "앱 이름을 입력하세요.";
  if (!id) throw "ID를 입력하거나 이름을 영문으로 작성하세요.";
  if (kind === "theme" && script) throw "테마는 Lua 스크립트를 포함할 수 없습니다.";
  if (type === "layout" && !layout && !script) throw "레이아웃 또는 Lua 중 하나는 필요합니다.";
  if (type === "script" && !script) throw "Lua 단독 액션은 스크립트가 필요합니다.";
  if (type === "script") {
    // 스크립트 단독은 layout 섹션을 비운다
  }
  const m = {format:"exlu/1", kind, type, name, author, id, api:1, modes:7};
  return "EXLU1\n#MANIFEST\n" + JSON.stringify(m) + "\n#LAYOUT\n" +
         (type === "script" ? "" : layout) + "\n#SCRIPT\n" + script + "\n#END\n";
}

async function save() {
  let text;
  try { text = buildExlu(); } catch (e) { say("msg1", e, "err"); return; }
  const id = currentId();
  try {
    const r = await fetch("/api/exlu/save?id=" + encodeURIComponent(id) +
                          "&overwrite=1", {method:"POST", body:text});
    const j = await r.json();
    if (!r.ok || !j.ok) { say("msg1", "저장 실패: " + (j.error || r.status), "err"); return; }
    say("msg1", "저장됨: " + id + ".exlu", "ok");
    refresh();
  } catch (e) { say("msg1", "저장 실패: " + e, "err"); }
}

function download() {
  let text;
  try { text = buildExlu(); } catch (e) { say("msg1", e, "err"); return; }
  const blob = new Blob([text], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentId() + ".exlu";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function refresh() {
  try {
    const r = await fetch("/api/exlu/list");
    const j = await r.json();
    const ul = $("list");
    ul.innerHTML = "";
    (j.files || []).forEach((f) => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.textContent = f.id;
      s.title = f.name + " / " + f.author;
      const t1 = document.createElement("span");
      t1.className = "tag";
      t1.textContent = f.kind === "theme" ? "theme" : (f.type === "script" ? "script" : "app");
      const b1 = document.createElement("button");
      b1.className = "ghost";
      b1.textContent = "열기";
      b1.onclick = () => load(f.id);
      const b2 = document.createElement("button");
      b2.className = "danger";
      b2.textContent = "삭제";
      b2.onclick = () => del(f.id);
      li.append(s, t1, b1, b2);
      ul.append(li);
    });
    if (!ul.children.length) say("msg3", "저장된 EXLU가 없습니다.", "warn");
    else say("msg3", "");
  } catch (e) { say("msg3", "목록 실패: " + e, "err"); }
}

async function load(id) {
  try {
    const r = await fetch("/api/exlu/get?id=" + encodeURIComponent(id));
    if (!r.ok) { say("msg3", "열기 실패: " + r.status, "err"); return; }
    const t = await r.text();
    const mi = t.indexOf("#MANIFEST");
    const li = t.indexOf("#LAYOUT");
    const si = t.indexOf("#SCRIPT");
    const ei = t.indexOf("#END");
    let man = {};
    if (mi >= 0 && li > mi) {
      man = JSON.parse(t.slice(t.indexOf("\n", mi) + 1, li).trim());
    }
    $("kind").value = man.kind === "theme" ? "theme" : "app";
    $("type").value = man.type === "script" ? "script" : "layout";
    $("name").value = man.name || id;
    $("author").value = man.author || "";
    $("id").value = id;
    $("layout").value = (li >= 0 && si > li)
      ? t.slice(t.indexOf("\n", li) + 1, si).replace(/\s+$/, "") : "";
    $("script").value = (si >= 0 && ei > si)
      ? t.slice(t.indexOf("\n", si) + 1, ei).replace(/\s+$/, "") : "";
    say("msg3", "불러옴: " + id, "ok");
  } catch (e) { say("msg3", "열기 실패: " + e, "err"); }
}

async function del(id) {
  if (!confirm(id + " 삭제할까요?")) return;
  try {
    const r = await fetch("/api/exlu/delete?id=" + encodeURIComponent(id),
                          {method:"POST"});
    const j = await r.json();
    if (!r.ok || !j.ok) { say("msg3", "삭제 실패: " + (j.error || r.status), "err"); return; }
    say("msg3", "삭제됨: " + id, "ok");
    refresh();
  } catch (e) { say("msg3", "삭제 실패: " + e, "err"); }
}

async function applyCurrent() {
  const id = currentId();
  if (!id) { say("msg3", "적용할 ID가 없습니다.", "err"); return; }
  try {
    const r = await fetch("/api/exlu/apply?id=" + encodeURIComponent(id),
                          {method:"POST"});
    const j = await r.json();
    if (!r.ok || !j.ok) { say("msg3", "적용 실패: " + (j.error || r.status), "err"); return; }
    say("msg3", "적용됨: " + id, "ok");
  } catch (e) { say("msg3", "적용 실패: " + e, "err"); }
}

$("kind").addEventListener("change", () => {
  const theme = $("kind").value === "theme";
  if (theme) $("type").value = "layout";
  $("type").disabled = theme;
});
refresh();
</script>
</body>
</html>
